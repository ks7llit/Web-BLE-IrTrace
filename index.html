<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IrTrace Access</title>
<style>
  :root {
    --bg: #eef0f4;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #e2e5eb;
    --text: #111318;
    --muted: #6b7280;
    --accent: #0052cc;
    --accent-lt: #e8f0ff;
    --green: #16a34a;
    --green-lt: #dcfce7;
    --red: #dc2626;
    --red-lt: #fee2e2;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --shadow: 0 12px 40px rgba(17, 24, 39, .10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: var(--sans);
    background:
      linear-gradient(180deg, rgba(255,255,255,.72), rgba(238,240,244,.92)),
      var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .auth-shell {
    width: min(100%, 440px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 2px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(0, 82, 204, .22);
  }

  .brand-icon svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .brand-name {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: .01em;
  }

  .brand-sub {
    margin-top: 2px;
    font-size: .78rem;
    color: var(--muted);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .panel-title {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0;
  }

  .panel-copy {
    margin-top: 4px;
    font-size: .9rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 14px 16px 0;
  }

  .tab-btn {
    min-height: 42px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface2);
    color: var(--muted);
    font: 700 .88rem var(--sans);
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }

  .tab-btn.active {
    background: var(--accent-lt);
    border-color: #9bbcf7;
    color: var(--accent);
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 13px;
    padding: 16px;
  }

  form[hidden] { display: none; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-family: var(--mono);
    font-size: .68rem;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  input {
    width: 100%;
    min-height: 44px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    background: #fff;
    color: var(--text);
    font: 500 .95rem var(--sans);
    outline: none;
    padding: 10px 12px;
    transition: border-color .15s, box-shadow .15s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 82, 204, .10);
  }

  .primary-btn {
    min-height: 46px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font: 800 .95rem var(--sans);
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0, 82, 204, .18);
    transition: background .15s, transform .15s;
  }

  .primary-btn:hover { background: #003fa3; }
  .primary-btn:active { transform: translateY(1px); }
  .primary-btn:disabled { background: #9ca3af; cursor: wait; box-shadow: none; }

  .status {
    min-height: 42px;
    margin: 0 16px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    padding: 10px 12px;
    font-size: .86rem;
    line-height: 1.35;
  }

  .status.ok {
    border-color: #86efac;
    background: var(--green-lt);
    color: var(--green);
  }

  .status.err {
    border-color: #fca5a5;
    background: var(--red-lt);
    color: var(--red);
  }

  .footer {
    text-align: center;
    font-family: var(--mono);
    font-size: .68rem;
    color: #98a2b3;
  }

  @media (max-width: 420px) {
    body { align-items: flex-start; padding-top: 18px; }
    .panel-title { font-size: 1.12rem; }
    .tabs, form { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 18c-1.5-1.5-2-3.5-2-6s.5-4.5 2-6"/><path d="M15 6c1.5 1.5 2 3.5 2 6s-.5 4.5-2 6"/><circle cx="12" cy="12" r="2"/><path d="M6 21c-2.5-2.5-4-6-4-9s1.5-6.5 4-9"/><path d="M18 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9"/></svg>
      </div>
      <div>
        <div class="brand-name">IrTrace</div>
        <div class="brand-sub">Account access for device setup</div>
      </div>
    </div>

    <section class="panel" aria-label="Account access">
      <div class="panel-head">
        <h1 class="panel-title">Sign in to configure</h1>
        <p class="panel-copy">Use your account before entering the BLE configuration page.</p>
      </div>

      <div class="tabs" role="tablist" aria-label="Authentication mode">
        <button class="tab-btn active" id="tab-signin" type="button" role="tab" aria-selected="true" aria-controls="signin-form">Sign in</button>
        <button class="tab-btn" id="tab-signup" type="button" role="tab" aria-selected="false" aria-controls="signup-form">Create account</button>
      </div>

      <form id="signin-form" autocomplete="on">
        <div class="field">
          <label for="signin-id">Email or phone</label>
          <input id="signin-id" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="signin-password">Password</label>
          <input id="signin-password" name="current-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="primary-btn" id="signin-submit" type="submit">Sign in</button>
      </form>

      <form id="signup-form" autocomplete="on" hidden>
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signup-phone">Phone number</label>
          <input id="signup-phone" name="tel" type="tel" autocomplete="tel" inputmode="tel" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="new-password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm password</label>
          <input id="signup-confirm" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="primary-btn" id="signup-submit" type="submit">Create account</button>
      </form>

      <div class="status" id="auth-status" role="status">Create an account or sign in to continue.</div>
    </section>

    <div class="footer">IrTrace BLE setup access</div>
  </main>

<script>
const USERS_KEY = 'irtrace.auth.users.v1';
const SESSION_KEY = 'irtrace.auth.session.v1';

const signinTab = document.getElementById('tab-signin');
const signupTab = document.getElementById('tab-signup');
const signinForm = document.getElementById('signin-form');
const signupForm = document.getElementById('signup-form');
const statusEl = document.getElementById('auth-status');

function loadUsers() {
  try {
    const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
    return Array.isArray(users) ? users : [];
  } catch (_) {
    return [];
  }
}

function saveUsers(users) {
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}

function normalizeEmail(value) {
  return String(value || '').trim().toLowerCase();
}

function normalizePhone(value) {
  return String(value || '').replace(/[^\d+]/g, '').replace(/(?!^)\+/g, '');
}

function setStatus(message, type) {
  statusEl.textContent = message;
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

function setBusy(form, busy) {
  Array.from(form.elements).forEach(el => { el.disabled = busy; });
}

function setMode(mode) {
  const signingIn = mode === 'signin';
  signinForm.hidden = !signingIn;
  signupForm.hidden = signingIn;
  signinTab.classList.toggle('active', signingIn);
  signupTab.classList.toggle('active', !signingIn);
  signinTab.setAttribute('aria-selected', signingIn ? 'true' : 'false');
  signupTab.setAttribute('aria-selected', signingIn ? 'false' : 'true');
  setStatus(signingIn ? 'Sign in with email or phone to continue.' : 'Create an account to unlock configuration access.');
}

function randomHex(bytes) {
  const values = new Uint8Array(bytes);
  crypto.getRandomValues(values);
  return Array.from(values, byte => byte.toString(16).padStart(2, '0')).join('');
}

async function sha256Hex(text) {
  if (!crypto.subtle) throw new Error('Secure browser crypto is unavailable on this page.');
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
}

async function hashPassword(password, salt) {
  return sha256Hex(salt + ':' + password);
}

function createSession(user) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    userId: user.id,
    email: user.email,
    phone: user.phone,
    loginAt: new Date().toISOString()
  }));
}

function redirectToConfig() {
  window.location.href = 'config.html';
}

function hasValidSession() {
  try {
    const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!session || !session.userId) return false;
    return loadUsers().some(user => user.id === session.userId);
  } catch (_) {
    return false;
  }
}

signinTab.addEventListener('click', () => setMode('signin'));
signupTab.addEventListener('click', () => setMode('signup'));

signinForm.addEventListener('submit', async event => {
  event.preventDefault();
  setBusy(signinForm, true);
  try {
    const identityRaw = document.getElementById('signin-id').value;
    const password = document.getElementById('signin-password').value;
    const email = normalizeEmail(identityRaw);
    const phone = normalizePhone(identityRaw);
    const user = loadUsers().find(item => item.email === email || item.phone === phone);
    if (!user) throw new Error('Account not found. Create an account first.');
    const hash = await hashPassword(password, user.salt);
    if (hash !== user.passwordHash) throw new Error('Password is incorrect.');
    createSession(user);
    setStatus('Signed in. Opening configuration...', 'ok');
    redirectToConfig();
  } catch (err) {
    setStatus(err.message || 'Sign in failed.', 'err');
  } finally {
    setBusy(signinForm, false);
  }
});

signupForm.addEventListener('submit', async event => {
  event.preventDefault();
  setBusy(signupForm, true);
  try {
    const email = normalizeEmail(document.getElementById('signup-email').value);
    const phone = normalizePhone(document.getElementById('signup-phone').value);
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    if (!email.includes('@')) throw new Error('Enter a valid email address.');
    if (phone.replace(/\D/g, '').length < 8) throw new Error('Enter a valid phone number.');
    if (password.length < 8) throw new Error('Password must be at least 8 characters.');
    if (password !== confirm) throw new Error('Passwords do not match.');

    const users = loadUsers();
    if (users.some(user => user.email === email)) throw new Error('This email is already registered.');
    if (users.some(user => user.phone === phone)) throw new Error('This phone number is already registered.');

    const salt = randomHex(16);
    const user = {
      id: 'usr_' + randomHex(12),
      email,
      phone,
      salt,
      passwordHash: await hashPassword(password, salt),
      createdAt: new Date().toISOString()
    };
    users.push(user);
    saveUsers(users);
    createSession(user);
    setStatus('Account created. Opening configuration...', 'ok');
    redirectToConfig();
  } catch (err) {
    setStatus(err.message || 'Account creation failed.', 'err');
  } finally {
    setBusy(signupForm, false);
  }
});

if (hasValidSession()) redirectToConfig();
</script>
</body>
</html>
