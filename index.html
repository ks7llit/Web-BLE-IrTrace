<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IrTrace BLE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #1a1d23;
    margin-bottom: 4px;
  }

  .sub { font-size: 0.8rem; color: #6b7280; margin-bottom: 20px; }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    width: 100%;
    max-width: 480px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .card-head {
    padding: 12px 16px;
    background: #f8f9fb;
    border-bottom: 1px solid #e5e7eb;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #6b7280;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Status dot */
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #d1d5db;
    display: inline-block;
    margin-right: 6px;
  }
  .dot.on  { background: #16a34a; box-shadow: 0 0 0 3px #dcfce7; }
  .dot.off { background: #d1d5db; }

  /* Connect button */
  #btn-connect {
    width: 100%;
    max-width: 480px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
    margin-bottom: 14px;
    background: #1a6cf5;
    color: #fff;
  }
  #btn-connect:hover  { background: #1558d6; }
  #btn-connect.conn   { background: #fee2e2; color: #dc2626; }

  /* Log */
  #log {
    padding: 12px 16px;
    height: 240px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    line-height: 1.7;
  }

  .line { display: flex; gap: 8px; }
  .ts   { color: #9ca3af; flex-shrink: 0; }
  .rx   { color: #1a6cf5; }
  .tx   { color: #16a34a; }
  .sys  { color: #9ca3af; font-style: italic; }
  .err  { color: #dc2626; }

  /* Send area */
  .send-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e5e7eb;
  }

  #inp-send {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color .15s;
  }
  #inp-send:focus { border-color: #1a6cf5; }

  #btn-send {
    padding: 9px 18px;
    background: #1a6cf5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background .15s;
  }
  #btn-send:hover    { background: #1558d6; }
  #btn-send:disabled { background: #d1d5db; cursor: not-allowed; }

  .status-text {
    font-size: 0.78rem;
    color: #6b7280;
    padding: 0 16px 12px;
  }
  .status-text.ok  { color: #16a34a; }
  .status-text.err { color: #dc2626; }
</style>
</head>
<body>

<h1>IrTrace BLE</h1>
<p class="sub">ESP32-C5 · Nordic UART Service</p>

<button id="btn-connect" onclick="toggleConnect()">
  🔵 Connect to IrTrace-BLE
</button>

<div class="card">
  <div class="card-head">
    <span><span class="dot off" id="dot"></span>Status</span>
    <span id="status-text">Disconnected</span>
  </div>
  <p class="status-text" id="status-detail">Press Connect and select IrTrace-BLE from the list.</p>
</div>

<div class="card">
  <div class="card-head">
    <span>Message Log</span>
    <span onclick="clearLog()" style="cursor:pointer;font-size:0.7rem;color:#9ca3af">Clear</span>
  </div>
  <div id="log"><div class="line"><span class="sys">— log empty —</span></div></div>
  <div class="send-row">
    <input id="inp-send" placeholder="Type a message..." disabled
           onkeydown="if(event.key==='Enter') sendMsg()">
    <button id="btn-send" disabled onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
// ============================================================
// THE KEY FIX: filter by SERVICE UUID, not by name
// This is what was preventing ESP32 from showing in scan list
// ============================================================
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX_UUID      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // ESP32 → Phone
const RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // Phone → ESP32

let device    = null;
let rxChar    = null;
let connected = false;
const enc     = new TextEncoder();
const dec     = new TextDecoder();

// Check browser support
if (!navigator.bluetooth) {
  setStatus('err', 'Web Bluetooth not supported', 'Use Chrome on Android or Chrome Desktop.');
  document.getElementById('btn-connect').disabled = true;
}

async function toggleConnect() {
  connected ? disconnect() : await connect();
}

async function connect() {
  setStatus('', 'Scanning...', 'Looking for IrTrace-BLE...');
  try {
    // Filter by SERVICE UUID — this reliably finds the device
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus('', 'Connecting...', 'Establishing GATT connection...');

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    // Subscribe to ESP32 notifications
    const txChar = await service.getCharacteristic(TX_UUID);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', onNotify);

    // Get write characteristic
    rxChar = await service.getCharacteristic(RX_UUID);

    onConnected();

  } catch (err) {
    if (err.name === 'NotFoundError') {
      setStatus('', 'Disconnected', 'Scan cancelled.');
    } else {
      setStatus('err', 'Error', err.message);
      log('err', err.message);
    }
  }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
}

function onConnected() {
  connected = true;
  document.getElementById('btn-connect').textContent = '🔴 Disconnect';
  document.getElementById('btn-connect').classList.add('conn');
  document.getElementById('dot').className = 'dot on';
  document.getElementById('inp-send').disabled = false;
  document.getElementById('btn-send').disabled  = false;
  setStatus('ok', 'Connected', 'Connected to ' + (device ? device.name : 'IrTrace-BLE'));
  log('sys', 'Connected to ' + device.name);
}

function onDisconnected() {
  connected = false;
  rxChar    = null;
  document.getElementById('btn-connect').textContent = '🔵 Connect to IrTrace-BLE';
  document.getElementById('btn-connect').classList.remove('conn');
  document.getElementById('dot').className = 'dot off';
  document.getElementById('inp-send').disabled = true;
  document.getElementById('btn-send').disabled  = true;
  setStatus('', 'Disconnected', 'Device disconnected.');
  log('sys', 'Disconnected');
}

function onNotify(event) {
  const msg = dec.decode(event.target.value).trim();
  log('rx', msg);
}

async function sendMsg() {
  const inp = document.getElementById('inp-send');
  const msg = inp.value.trim();
  if (!msg || !connected || !rxChar) return;
  try {
    await rxChar.writeValue(enc.encode(msg));
    log('tx', msg);
    inp.value = '';
  } catch (err) {
    log('err', 'Send failed: ' + err.message);
  }
}

function setStatus(type, label, detail) {
  document.getElementById('status-text').textContent  = label;
  const d = document.getElementById('status-detail');
  d.textContent  = detail;
  d.className    = 'status-text ' + type;
}

let logClear = true;
function log(type, msg) {
  const el = document.getElementById('log');
  if (logClear) { el.innerHTML = ''; logClear = false; }
  const ts  = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const row = document.createElement('div');
  row.className = 'line';
  row.innerHTML = `<span class="ts">${ts}</span><span class="${type}">${esc(msg)}</span>`;
  el.appendChild(row);
  while (el.children.length > 200) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML =
    '<div class="line"><span class="sys">— cleared —</span></div>';
  logClear = false;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
